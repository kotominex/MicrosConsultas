@if (request(); as req) {
  <div class="overlay" (click)="resolve(false)">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-message" (click)="$event.stopPropagation()">
      <p id="confirm-message">{{ req.message }}</p>
      <div class="actions">
        <button type="button" class="secondary" appAutofocus (click)="resolve(false)">Cancelar</button>
        <button type="button" class="danger" (click)="resolve(true)">Eliminar</button>
      </div>
    </div>
  </div>
}
